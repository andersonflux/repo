task:
  name: Regtest functional tests
  container:
    image: $ELECTRUM_IMAGE
    cpu: 1
    memory: 1G
  pip_cache:
    folder: ~/.cache/pip
    fingerprint_script: echo Regtest && echo $ELECTRUM_IMAGE && cat $ELECTRUM_REQUIREMENTS
    populate_script: mkdir -p ~/.cache/pip
  electrum_cache:
    folder: /tmp/electrum-build
    populate_script: mkdir -p /tmp/electrum-build
  bitcoind_cache:
    folder: /tmp/bitcoind
    populate_script: mkdir -p /tmp/bitcoind
  install_script:
    - apt-get update
    - apt-get -y install libsecp256k1-0 curl jq bc
    - pip3 install .[tests]
    - pip3 install electrumx
    - add-apt-repository -y ppa:visvirial/monacoin
    - apt-get -qq update
    - apt-get install -yq monacoind
  bitcoind_service_background_script:
    - electrum_mona/tests/regtest/run_bitcoind.sh
  electrumx_service_background_script:
    - electrum_mona/tests/regtest/run_electrumx.sh
  regtest_script:
    - sleep 10s
    - python3 -m unittest electrum_mona/tests/regtest.py
  env:
    ELECTRUM_IMAGE: python:3.7
    ELECTRUM_REQUIREMENTS: contrib/requirements/requirements-travis.txt
    # ElectrumX exits with an error without this:
    ALLOW_ROOT: 1

task:
  name: Windows build
  container:
    dockerfile: contrib/build-wine/Dockerfile
    cpu: 1
    memory: 2G
  build_script:
    - cd contrib/build-wine
    - ./make_win.sh
  binaries_artifacts:
    path: "contrib/build-wine/dist/*"
  env:
    CIRRUS_WORKING_DIR: /opt/wine64/drive_c/electrum-mona

task:
  name: Android build
  container:
    dockerfile: contrib/android/Dockerfile
    cpu: 2
    memory: 2G
  build_script:
    - ./contrib/android/make_apk
  binaries_artifacts:
    path: "dist/*"

task:
  name: MacOS build
  macos_instance:
    image: catalina-xcode-11.3.1
  env:
    TARGET_OS: macOS
  install_script:
    - git fetch --all --tags
  build_script:
    - ./contrib/osx/make_osx
  sum_script:
    - ls -lah dist
    - shasum -a 256 dist/*.dmg
  binaries_artifacts:
    path: "dist/*"

task:
  name: AppImage build
  container:
    dockerfile: contrib/build-linux/appimage/Dockerfile
    cpu: 2
    memory: 1G
  build_script:
    - ./contrib/build-linux/appimage/make_appimage.sh
  binaries_artifacts:
    path: "dist/*"

task:
  name: tarball build
  container:
    dockerfile: contrib/build-linux/sdist/Dockerfile
    cpu: 1
    memory: 1G
  build_script:
    - ./contrib/build-linux/sdist/make_sdist.sh
  binaries_artifacts:
    path: "dist/*"

task:
  name: Submodules
  container:
    image: python:3.7
    cpu: 1
    memory: 1G
  fetch_script:
    - git fetch --all --tags
  check_script:
    - ./contrib/deterministic-build/check_submodules.sh
  only_if: $CIRRUS_TAG != ''
